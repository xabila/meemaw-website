<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi Mathus — Meemaw Math ⚔️🧮</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/math/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/math/assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/math/assets/apple-touch-icon.png">

    <!-- Apple Smart App Banner for automatic iOS native app header -->
    <meta name="apple-itunes-app" content="app-id=6824002615">

    <!-- Open Graph for WhatsApp / Telegram / iMessage preview -->
    <meta property="og:title" content="🧮 Défi Mathus — Démasque l'équation secrète sans calculatrice !" />
    <meta property="og:description" content="Indices verts et oranges façon Motus : ouvre Meemaw Math pour jouer exactement la même équation et battre ce score !" />
    <meta property="og:image" content="https://meemaw.app/math/assets/og-math-icon.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🧮 Défi Mathus — Meemaw Math" />
    <meta name="twitter:description" content="Démasque l'équation secrète en 6 essais maximum sans calculatrice !" />
    <meta name="twitter:image" content="https://meemaw.app/math/assets/og-math-icon.jpg" />

    <style>
        :root {
            --emerald: #16A34A;
            --emerald-soft: #DCFCE7;
            --ink: #1A1A2E;
            --cream: #FFF8F0;
            --yellow: #FACC15;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            border: 3px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            max-width: 420px;
            width: 100%;
            padding: 36px 28px;
            text-align: center;
        }

        .app-icon {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            border: 3px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
            margin: 0 auto 16px;
            display: block;
        }

        .badge {
            display: inline-block;
            background: var(--emerald-soft);
            color: var(--ink);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 999px;
            border: 2px solid var(--ink);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--ink);
            opacity: 0.7;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .challenger-info {
            background: var(--cream);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 22px;
            border: 2px solid var(--ink);
        }

        .challenger-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--emerald);
        }

        .score {
            font-size: 32px;
            font-weight: 900;
            color: var(--ink);
            margin: 6px 0 4px;
        }

        .score-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--ink);
            opacity: 0.6;
            text-transform: uppercase;
        }

        .btn-open {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--emerald);
            color: var(--white);
            font-size: 16px;
            font-weight: 800;
            border: 3px solid var(--ink);
            border-radius: 14px;
            text-decoration: none;
            margin-bottom: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            color: var(--ink);
            font-size: 14px;
            font-weight: 800;
            border: 2.5px solid var(--ink);
            border-radius: 14px;
            text-decoration: none;
            margin-bottom: 10px;
        }

        .link-site {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--emerald);
            text-decoration: none;
        }
    </style>

    <script>
        const params = new URLSearchParams(window.location.search);
        const challenger = params.get('c') || params.get('challenger') || 'Un ami';
        const score = params.get('s') || params.get('score') || '0';
        const issue = params.get('d');
        const eqRaw = params.get('e') || '';
        const eqCount = eqRaw ? eqRaw.split('.').filter(Boolean).length : 1;

        function computeTitle() {
            if (params.get('title')) return params.get('title');
            if (issue) return 'Mathus du Jour #' + issue;
            if (eqCount > 1) return 'Série Mathus (' + eqCount + ' équations)';
            return 'Équation secrète Mathus';
        }

        function buildDeepLink() {
            return 'meemawmath://challenge/m' + window.location.search;
        }

        function openApp() {
            window.location.href = buildDeepLink();
        }

        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('challengerName').textContent = challenger;
            document.getElementById('challengerScore').textContent = score + ' PTS';
            document.getElementById('dictationTitle').textContent = '🧮 ' + computeTitle();
        });
    </script>
</head>
<body>
    <div class="card">
        <img src="/math/assets/apple-touch-icon.png" alt="Meemaw Math" class="app-icon">
        <div class="badge">🟩🟧⬛ Défi Mathus</div>
        <h1>DÉFI MATHUS REÇU !</h1>
        <p class="subtitle">Démasque exactement la même équation secrète en 6 essais sans calculatrice</p>

        <div class="challenger-info">
            <p id="dictationTitle" class="score-label" style="margin-bottom: 8px;">🧮 Équation secrète Mathus</p>
            <p class="challenger-name" id="challengerName">Un ami</p>
            <p class="score" id="challengerScore">0 PTS</p>
            <p class="score-label">Score à battre</p>
        </div>

        <a href="javascript:openApp()" class="btn-open">⚔️ RELEVER LE DÉFI DANS L'APP</a>
        <a href="https://apps.apple.com/app/id6824002615" class="btn-download">📲 Télécharger Meemaw Math (Gratuit)</a>
        <a href="/math/" class="link-site">Découvrir Meemaw Math →</a>
    </div>
</body>
</html>
